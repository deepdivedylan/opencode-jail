services:
  docker-access-test:
    image: alpine:3.19
    container_name: docker-access-test
    command: >
      sh -c "
        echo '=== Docker socket access test ===' &&
        if [ -S /var/run/docker.sock ]; then
          echo '[PASS] /var/run/docker.sock is present' ;
        else
          echo '[FAIL] /var/run/docker.sock not found' && exit 1 ;
        fi &&
        if docker info > /dev/null 2>&1; then
          echo '[PASS] docker info succeeded' ;
        else
          echo '[FAIL] docker info failed' && exit 1 ;
        fi &&
        echo '[PASS] Docker container access verified' &&
        docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' &&
        echo '=== Done ==='
      "
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Install docker CLI at runtime (Alpine package)
    entrypoint: >
      sh -c "
        apk add --quiet docker-cli 2>/dev/null &&
        exec sh -c \"$$@\"
      " --
